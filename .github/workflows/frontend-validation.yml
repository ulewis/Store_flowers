name: Frontend validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Check Apps Script source syntax
        shell: bash
        run: |
          set -euo pipefail
          cp apps-script/Code.gs /tmp/store-backend.js
          node --check /tmp/store-backend.js

      - name: Check required storefront files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f admin.html
          test -f assets/app.js
          test -f assets/admin.js
          test -f assets/config.js
          test -f assets/mobile-fixes.css
          test -f assets/admin-functional.css
          test -f assets/admin-product-preview.js
          test -f assets/admin-backend-guard.js
          grep -q "2026-09-17.5" apps-script/Code.gs
      - name: Check current Apps Script endpoint
        shell: bash
        run: |
          set -euo pipefail
          grep -q "AKfycbxeCTlWZKZZxjSFJ75KdSBTDmz8plM10JgcFmdT2drDLWgLTCI5XBHE5MoicqBs_5YD" assets/config.js
