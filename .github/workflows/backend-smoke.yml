name: Backend smoke test

on:
  push:
    branches: [main]
    paths:
      - 'assets/config.js'
      - '.github/workflows/backend-smoke.yml'
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read API URL
        shell: bash
        run: |
          API_URL=$(grep "API_URL:" assets/config.js | sed -E "s/.*API_URL: '([^']+)'.*/\1/")
          if [ -z "$API_URL" ]; then
            echo "API_URL no configurada"
            exit 1
          fi
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"

      - name: Health check
        shell: bash
        run: |
          RESPONSE=$(curl -fsSL --retry 2 --retry-delay 2 "$API_URL?action=health")
          echo "$RESPONSE"
          echo "$RESPONSE" | jq -e '.ok == true and .data.status == "ok"' >/dev/null

      - name: Bootstrap check
        shell: bash
        run: |
          RESPONSE=$(curl -fsSL --retry 2 --retry-delay 2 "$API_URL?action=bootstrap")
          echo "$RESPONSE" | jq -e '
            .ok == true
            and ((.data.version == "2026-09-17.3") or (.data.version == "2026-09-17.5"))
            and (.data.products | length) >= 4
            and (.data.products | all(
              (.id | length) > 0
              and (.nombre | length) > 0
              and ((.precio | tonumber) >= 0)
              and ((.stock_fisico | tonumber) >= 0)
              and ((.stock_reservado | tonumber) >= 0)
              and ((.available_stock | tonumber) >= 0)
              and (.imagen_principal | startswith("https://ulewis.github.io/Store_flowers/assets/products/"))
            ))
            and (.data.delivery | length) >= 5
            and (.data.categories | length) >= 6
            and (.data.config.WHATSAPP_NUMBER == "51956892798")
            and (.data.config.STORE_STATUS == "open")
          ' >/dev/null
          echo "$RESPONSE" | jq -r '.data.version | "Backend verificado: " + .'
          echo "Catálogo, imágenes, stock, categorías, delivery y WhatsApp correctos."

      - name: POST parser check without creating a reservation
        shell: bash
        run: |
          RESPONSE=$(curl -fsSL --retry 2 --retry-delay 2 \
            -H 'Content-Type: text/plain;charset=utf-8' \
            --data '{"action":"reserve","payload":{}}' \
            "$API_URL")
          echo "$RESPONSE"
          echo "$RESPONSE" | jq -e '.ok == false and (.error | contains("Falta el nombre"))' >/dev/null
